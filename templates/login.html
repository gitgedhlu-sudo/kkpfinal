<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172554"><title>Login | KKP Fireworks</title>
<style>
:root{--navy:#172554;--blue:#1d4ed8;--gold:#fbbf24;--ink:#182033;--muted:#697386;--paper:#f6f8fc;--line:#e7eaf1}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#e0e7ff,transparent 38%),var(--paper);font-family:Arial,sans-serif;color:var(--ink);display:grid;place-items:center;padding:20px}.login-card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 24px 70px #17255415}.mark{width:54px;height:54px;border-radius:17px;background:var(--navy);color:var(--gold);display:grid;place-items:center;font-size:32px;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:var(--blue)}h1{font-size:29px;margin:8px 0}p{color:var(--muted);line-height:1.5}.field{display:block;font-weight:700;font-size:13px;margin:18px 0 7px}input{width:100%;border:1px solid #d8deea;border-radius:12px;padding:14px;font-size:16px;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #1d4ed81a}.submit{width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;padding:15px;margin-top:22px;cursor:pointer}.error{background:#fff1f2;color:#b42318;border:1px solid #fecdd3;border-radius:10px;padding:12px;font-size:14px}.foot{font-size:12px;text-align:center;margin-top:24px}
</style></head><body><main class="login-card"><div class="mark">✦</div><div class="eyebrow">KKP YUVAK MANDAL NAVSARI (PURV)</div><h1>Welcome back</h1><p>Sign in to access the KKP Fireworks catalogue.</p>{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}<form method="post" action="{{ url_for('login', next=request.args.get('next','')) }}"><label class="field" for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus placeholder="Enter username"><label class="field" for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter password"><button class="submit" type="submit">Login →</button></form><div class="foot">Created by <strong>Aditya Maganbhai Patel</strong></div></main></body></html>
